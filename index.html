<div id="lobby"><h1>BEY ARENA</h1><p>1 contro 1. Spingi l’avversario fuori dai varchi o lascialo senza giri.<br>Prima del via scegli la potenza di lancio: al massimo (zona oro) ottieni un bonus!</p>

<script type="module">

const R=300,RB=26,ACC=520,BOWL=.9,DAMP=1.4,REST=.9,DASH=560,DMG=.028,GAPW=.17,GAPS=[Math.PI/2,-Math.PI/2],G=1300,WH=26,PF=.95;let ts=1,rnd=0,pw=[.5,.5],lk=[0,0],lkT=0,gLk=[0,0],aiL=0;
const TY=[
 {n:'Phoenix',c:'#ff6a2b',ic:'🔥',d:'Attacco: colpi devastanti',s:'Fiammata',m:1,r:26,acc:1.15,atk:1.35,def:1.15,dec:1.15},

 {n:'Orbit',c:'#b46cff',ic:'🌀',d:'Resistenza: giri più lunghi',s:'Vortice',m:1,r:25,acc:1,atk:.9,def:1,dec:.65},
 {n:'Volt',c:'#ffe23a',ic:'⚡',d:'Velocità: agile e fulmineo',s:'Raffica',m:.8,r:24,acc:1.35,atk:1,def:1.2,dec:1.05}];
TY.forEach((T,i)=>T.k=i);
const LY=[['Lama','🗡',26,1.35,1.15,1],['Corazza','🛡',29,.85,.7,1],['Anello','⭕',25,.9,1,.9],['Stella','⭐',24,1,1.2,1]],
DS=[['Leggero',.8,1.15],['Medio',1.1,1],['Pesante',1.7,.8]],TP=[['Piatta',1.3,1.2],['Sfera',1,.8],['Spillo',.75,.6]],
CL=['#ff4f4f','#4fd1ff','#9dff4f','#ffb02e','#d27bff','#ffffff'],CN=['Rosso','Azzurro','Verde','Arancio','Viola','Bianco'];

function mkCustom(id){const x=id-4,c=x%6,p=(x/6|0)%3,d=(x/18|0)%3,l=x/54|0,L=LY[l],D=DS[d],P=TP[p];
 return{n:'Custom',c:CL[c],ic:L[1],d:L[0]+' · '+D[0]+' · '+P[0],s:TY[l].s,k:l,m:D[1],r:L[2],acc:D[2]*P[1],atk:L[3],def:L[4],dec:L[5]*P[2]}}
for(let i=4;i<4+216;i++)TY[i]=mkCustom(i);
const mk=(x,d,t=0)=>{const T=TY[t];return{x,y:0,vx:0,vy:0,sp:100,dir:d,t:T.k,mb:T.m,m:T.m,r:T.r,acc:T.acc,atk:T.atk,def:T.def,dec:T.dec,guard:0,tor:0,boost:0,haste:0,fury:0,sup:0,cdD:0,cdG:0,cdT:0,ix:0,iy:0,out:0,z:0,vz:0}};
const angD=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
let S=[mk(-150,1),mk(150,-1)],ev=[],evSeq=0,OR=[],orbT=4;
function fx(x,y,p){ev.push([++evSeq,Math.round(x),Math.round(y),Math.round(p)]);if(ev.length>8)ev.shift();spark(x,y,p)}
function dm(x,y,d){ev.push([++evSeq,Math.round(x),Math.round(y),-1,Math.round(d*10)/10]);if(ev.length>8)ev.shift();pop(x,y,d)}
const dash=(b,o)=>{if(b.cdD>0||b.guard>0)return;let dx=b.ix,dy=b.iy,l=Math.hypot(dx,dy);if(l<.2){dx=o.x-b.x;dy=o.y-b.y;l=Math.hypot(dx,dy)||1}b.vx+=dx/l*DASH;b.vy+=dy/l*DASH;b.sp-=3;b.cdD=2};
const gd=b=>{if(b.cdG>0)return;b.guard=1.4;b.cdG=6};

 const dx=o.x-b.x,dy=o.y-b.y,l=Math.hypot(dx,dy)||1;
 if(b.t===0){b.boost=1.6;b.vx+=dx/l*480;b.vy+=dy/l*480}
 else if(b.t===1){const f=Math.max(0,1-l/280);o.vx+=dx/l*650*f/o.mb;o.vy+=dy/l*650*f/o.mb;o.sp-=5*f;fx(b.x,b.y,300)}
 else if(b.t===2)b.tor=1.6;else b.haste=1.8};
const sup=(b,o)=>{if(b.fury<100||b.guard>0)return;b.fury=0;b.sup=1.3;const dx=o.x-b.x,dy=o.y-b.y,l=Math.hypot(dx,dy)||1;b.vx+=dx/l*850;b.vy+=dy/l*850;fx(b.x,b.y,420)};
function step(dt){
 const [A,B]=S;
 for(const b of S){
  const o=b===A?B:A,ratio=Math.max(0,b.sp)/100;
  b.cdD=Math.max(0,b.cdD-dt);b.cdG=Math.max(0,b.cdG-dt);b.cdT=Math.max(0,b.cdT-dt);b.guard=Math.max(0,b.guard-dt);b.tor=Math.max(0,b.tor-dt);b.boost=Math.max(0,b.boost-dt);b.haste=Math.max(0,b.haste-dt);b.sup=Math.max(0,b.sup-dt);if(ph===2)b.fury=Math.min(100,b.fury+2*dt);
  b.m=b.mb*(b.guard>0?3.2:1)*(b.sup>0?1.6:1);
  const ctrl=(b.guard>0?.25:1)*(.3+.7*ratio)*(ph===2?1:0)*(b.z>2?.08:1);
  const bw=b.z>2?0:BOWL;let ax=b.ix*ACC*b.acc*(b.haste>0?1.7:1)*ctrl-b.x*bw,ay=b.iy*ACC*b.acc*(b.haste>0?1.7:1)*ctrl-b.y*bw;
  const w=(1-ratio)**2*140;ax+=(Math.random()-.5)*w*2;ay+=(Math.random()-.5)*w*2; // instabilità a bassi giri
  if(o.tor>0){const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||1,f=620*Math.max(0,1-d/420)/b.m;ax+=dx/d*f;ay+=dy/d*f}
  b.vx+=ax*dt;b.vy+=ay*dt;const k=Math.exp(-DAMP*(b.z>2?.2:1)*dt);b.vx*=k;b.vy*=k;
  b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.z>0||b.vz>0){b.vz-=G*dt;b.z+=b.vz*dt;if(b.z<=0){b.z=0;land(b)}}
  b.sp-=(Math.max(.4,1.2*b.dec-(b.guard>0?.6:0))+.0035*Math.hypot(b.vx,b.vy))*dt;

  const d=Math.hypot(b.x,b.y);
  if(d>R-b.r){
   const th=Math.atan2(b.y,b.x);

   }else if(d>R+b.r*.5)b.out=1;
  }
 }
 if(ph===2){ // sfere di energia: ricaricano i giri
  orbT-=dt;if(orbT<=0&&OR.length<2){const a=Math.random()*6.28,q=Math.random()*190;OR.push([Math.round(Math.cos(a)*q),Math.round(Math.sin(a)*q)]);orbT=6+Math.random()*4}
  for(const b of S)for(let i=OR.length-1;i>=0;i--)if(Math.hypot(b.x-OR[i][0],b.y-OR[i][1])<b.r+14){b.sp=Math.min(100,b.sp+15);b.fury=Math.min(100,b.fury+10);dm(b.x,b.y,-15);fx(OR[i][0],OR[i][1],90);OR.splice(i,1)}
 }
 // collisione blade-blade
 let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);const rr=A.r+B.r;
 if(d<rr&&d>0&&Math.abs(A.z-B.z)<rr*.6){
