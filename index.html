<button id="ex" style="position:fixed;left:12px;bottom:max(16px,env(safe-area-inset-bottom));display:none;padding:10px 14px;border-radius:12px;border:2px solid #fff3;background:#ffffff14;color:#fff;font:700 13px sans-serif;touch-action:auto">Esci</button>

<div id="lobby"><h1>BEY ARENA</h1><p>1 contro 1. Spingi l’avversario fuori dai varchi o lascialo senza giri.<br>Prima del via scegli la potenza di lancio: al massimo (zona oro) ottieni un bonus!</p>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,set,get,remove,onValue,onDisconnect,runTransaction} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyBiKEfo1c7c12kAYxlRuZNjh-Spz4W1Tbw",authDomain:"wandertutto.firebaseapp.com",databaseURL:"https://wandertutto-default-rtdb.europe-west1.firebasedatabase.app",projectId:"wandertutto",storageBucket:"wandertutto.firebasestorage.app",messagingSenderId:"933606082300",appId:"1:933606082300:web:3ef3d5e1a233f86f7f3979"}));
const $=id=>document.getElementById(id), P=c=>ref(db,'bey/'+c);

/* ================= FISICA (tutto tarabile qui) ================= */
const R=300,RB=26,ACC=520,BOWL=.9,DAMP=1.4,REST=.9,DASH=560,DMG=.028,GAPW=.17,GAPS=[Math.PI/2,-Math.PI/2],G=1300,WH=26,PF=.95;let ts=1,rnd=0,pw=[.5,.5],lk=[0,0],lkT=0,gLk=[0,0],aiL=0;
const TY=[
 {n:'Phoenix',c:'#ff6a2b',ic:'🔥',d:'Attacco: colpi devastanti',s:'Fiammata',m:1,r:26,acc:1.15,atk:1.35,def:1.15,dec:1.15},
 {n:'Golem',c:'#7ad65a',ic:'⛰️',d:'Difesa: pesante e solido',s:'Terremoto',m:1.7,r:29,acc:.8,atk:.85,def:.65,dec:1},
 {n:'Orbit',c:'#b46cff',ic:'🌀',d:'Resistenza: giri più lunghi',s:'Vortice',m:1,r:25,acc:1,atk:.9,def:1,dec:.65},
 {n:'Volt',c:'#ffe23a',ic:'⚡',d:'Velocità: agile e fulmineo',s:'Raffica',m:.8,r:24,acc:1.35,atk:1,def:1.2,dec:1.05}];
const mk=(x,d,t=0)=>{const T=TY[t];return{x,y:0,vx:0,vy:0,sp:100,dir:d,t,mb:T.m,m:T.m,r:T.r,acc:T.acc,atk:T.atk,def:T.def,dec:T.dec,guard:0,tor:0,boost:0,haste:0,fury:0,sup:0,cdD:0,cdG:0,cdT:0,ix:0,iy:0,out:0,z:0,vz:0}};
const angD=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
let S=[mk(-150,1),mk(150,-1)],ev=[],evSeq=0,OR=[],orbT=4;
function fx(x,y,p){ev.push([++evSeq,Math.round(x),Math.round(y),Math.round(p)]);if(ev.length>8)ev.shift();spark(x,y,p)}
function dm(x,y,d){ev.push([++evSeq,Math.round(x),Math.round(y),-1,Math.round(d*10)/10]);if(ev.length>8)ev.shift();pop(x,y,d)}
const dash=(b,o)=>{if(b.cdD>0||b.guard>0)return;let dx=b.ix,dy=b.iy,l=Math.hypot(dx,dy);if(l<.2){dx=o.x-b.x;dy=o.y-b.y;l=Math.hypot(dx,dy)||1}b.vx+=dx/l*DASH;b.vy+=dy/l*DASH;b.sp-=3;b.cdD=2};
const gd=b=>{if(b.cdG>0)return;b.guard=1.4;b.cdG=6};
const vort=(b,o)=>{if(b.cdT>0||b.guard>0)return;b.cdT=7;b.sp-=5;
 const dx=o.x-b.x,dy=o.y-b.y,l=Math.hypot(dx,dy)||1;
 if(b.t===0){b.boost=1.6;b.vx+=dx/l*480;b.vy+=dy/l*480}
 else if(b.t===1){const f=Math.max(0,1-l/280);o.vx+=dx/l*650*f/o.mb;o.vy+=dy/l*650*f/o.mb;o.sp-=5*f;fx(b.x,b.y,300)}
 else if(b.t===2)b.tor=1.6;else b.haste=1.8};
const sup=(b,o)=>{if(b.fury<100||b.guard>0)return;b.fury=0;b.sup=1.3;const dx=o.x-b.x,dy=o.y-b.y,l=Math.hypot(dx,dy)||1;b.vx+=dx/l*850;b.vy+=dy/l*850;fx(b.x,b.y,420)};
function step(dt){
 const [A,B]=S;
 for(const b of S){
  const o=b===A?B:A,ratio=Math.max(0,b.sp)/100;
  b.cdD=Math.max(0,b.cdD-dt);b.cdG=Math.max(0,b.cdG-dt);b.cdT=Math.max(0,b.cdT-dt);b.guard=Math.max(0,b.guard-dt);b.tor=Math.max(0,b.tor-dt);b.boost=Math.max(0,b.boost-dt);b.haste=Math.max(0,b.haste-dt);b.sup=Math.max(0,b.sup-dt);if(ph===2)b.fury=Math.min(100,b.fury+2*dt);
  b.m=b.mb*(b.guard>0?3.2:1)*(b.sup>0?1.6:1);
  const ctrl=(b.guard>0?.25:1)*(.3+.7*ratio)*(ph===2?1:0)*(b.z>2?.08:1);
  const bw=b.z>2?0:BOWL;let ax=b.ix*ACC*b.acc*(b.haste>0?1.7:1)*ctrl-b.x*bw,ay=b.iy*ACC*b.acc*(b.haste>0?1.7:1)*ctrl-b.y*bw;
  const w=(1-ratio)**2*140;ax+=(Math.random()-.5)*w*2;ay+=(Math.random()-.5)*w*2; // instabilità a bassi giri
  if(o.tor>0){const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||1,f=620*Math.max(0,1-d/420)/b.m;ax+=dx/d*f;ay+=dy/d*f}
  b.vx+=ax*dt;b.vy+=ay*dt;const k=Math.exp(-DAMP*(b.z>2?.2:1)*dt);b.vx*=k;b.vy*=k;
  b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.z>0||b.vz>0){b.vz-=G*dt;b.z+=b.vz*dt;if(b.z<=0){b.z=0;land(b)}}
  b.sp-=(Math.max(.4,1.2*b.dec-(b.guard>0?.6:0))+.0035*Math.hypot(b.vx,b.vy))*dt;
  if(b.sp<0)b.sp=0;
  const d=Math.hypot(b.x,b.y);
  if(d>R-b.r){
   const th=Math.atan2(b.y,b.x);
   if(b.z<WH&&!GAPS.some(g=>Math.abs(angD(th,g))<GAPW)){
    const nx=b.x/d,ny=b.y/d,vn=b.vx*nx+b.vy*ny;
    if(vn>0){b.vx-=1.55*vn*nx;b.vy-=1.55*vn*ny;b.sp-=vn*.012;if(vn>120)fx(nx*R,ny*R,vn*.5)}
    b.x=nx*(R-b.r);b.y=ny*(R-b.r);
   }else if(d>R+b.r*.5)b.out=1;
  }
 }
 if(ph===2){ // sfere di energia: ricaricano i giri
  orbT-=dt;if(orbT<=0&&OR.length<2){const a=Math.random()*6.28,q=Math.random()*190;OR.push([Math.round(Math.cos(a)*q),Math.round(Math.sin(a)*q)]);orbT=6+Math.random()*4}
  for(const b of S)for(let i=OR.length-1;i>=0;i--)if(Math.hypot(b.x-OR[i][0],b.y-OR[i][1])<b.r+14){b.sp=Math.min(100,b.sp+15);b.fury=Math.min(100,b.fury+10);dm(b.x,b.y,-15);fx(OR[i][0],OR[i][1],90);OR.splice(i,1)}
 }
 // collisione blade-blade
 let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);const rr=A.r+B.r;
 if(d<rr&&d>0&&Math.abs(A.z-B.z)<rr*.6){
  const nx=dx/d,ny=dy/d,iA=1/A.m,iB=1/B.m,ov=rr-d;
  A.x-=nx*ov*iA/(iA+iB);A.y-=ny*ov*iA/(iA+iB);B.x+=nx*ov*iB/(iA+iB);B.y+=ny*ov*iB/(iA+iB);
  const vn=(A.vx-B.vx)*nx+(A.vy-B.vy)*ny;
  if(vn>0){
   const j=(1+REST)*vn/(iA+iB);
   A.vx-=j*iA*nx;A.vy-=j*iA*ny;B.vx+=j*iB*nx;B.vy+=j*iB*ny;
   // attrito tangenziale: la rotazione di un blade "spinge" di lato l'altro
   const tx=-ny,ty=nx,sA=A.sp/100*A.dir,sB=B.sp/100*B.dir;
   B.vx+=tx*55*sA/B.m;B.vy+=ty*55*sA/B.m;A.vx-=tx*55*sB/A.m*-1;A.vy-=ty*55*sB/A.m*-1;
   if(vn>40){
    const dB=vn*DMG*(.5+A.sp/100*.7)*(B.guard>0?.3:1)*A.atk*(A.boost>0?1.8:1)*(A.sup>0?2.6:1)*B.def,dA=vn*DMG*(.5+B.sp/100*.7)*(A.guard>0?.3:1)*B.atk*(B.boost>0?1.8:1)*(B.sup>0?2.6:1)*A.def;
    B.sp-=dB+dA*.25;A.sp-=dA+dB*.25;fx((A.x+B.x)/2,(A.y+B.y)/2,vn);hop(A,B,vn);A.fury=Math.min(100,A.fury+dB*3+dA*2);B.fury=Math.min(100,B.fury+dA*3+dB*2);dm(B.x,B.y,dB);dm(A.x,A.y,dA);
   }
  }
 }
 if(ph===2){
  const l=S.map(b=>b.out||b.sp<=0);
  if(l[0]||l[1]){win=l[0]&&l[1]?(S[0].sp>S[1].sp?0:1):l[0]?1:0;sc[win]++;ph=3;tp=3.5;fx(S[1-win].x,S[1-win].y,600)}
 }
}

/* ================= RETE ================= */
let role=null,code='',ph=0,tp=0,win=-1,sc=[0,0],names=['Blader','Avversario'],types=[0,0],myT=0,snap=null,snapT=0,lastEv=0,pd=0,pg=0,pt=0,ps=0,rin={},phT=0;
const cnt={d:0,g:0,t:0,s:0},me=()=>role==='guest'?1:0,rid=()=>Math.random().toString(36).slice(2,6).toUpperCase(),nm=()=>($('nm').value.trim()||'Blader').slice(0,12),st=t=>$('st').textContent=t;
function startRound(){S=[mk(-150,1,types[0]),mk(150,-1,types[1])];S.forEach(b=>b.sp=0);OR=[];orbT=4;ph=4;tp=9;rnd++;lk=[0,0];pw=[.5,.5];lkT=0;aiL=tp-1.2-Math.random()*1.6;win=-1;phT=performance.now()}
async function host(c){
 role='host';code=c;names[0]=nm();types[0]=myT;enter();
 onDisconnect(P('rooms/'+c)).remove();
 onValue(P(`rooms/${c}/p2`),s=>{const v=s.val();
  if(v){names[1]=v.n||'Avversario';types[1]=v.t|0;onDisconnect(P('queue')).cancel();if(ph===0){sc=[0,0];startRound()}}
  else if(ph>0){ph=0;sc=[0,0];S=[mk(-150,1),mk(150,-1)]}});
 onValue(P(`rooms/${c}/in`),s=>{rin=s.val()||{};if(ph===4&&rin.lk===rnd&&!lk[1]){lk[1]=1;pw[1]=Math.max(0,Math.min(1,+rin.pw||0))}
  if(ph===2){if((rin.d||0)!==pd)dash(S[1],S[0]);if((rin.g||0)!==pg)gd(S[1]);if((rin.t||0)!==pt)vort(S[1],S[0]);if((rin.s||0)!==ps)sup(S[1],S[0])}
  pd=rin.d||0;pg=rin.g||0;pt=rin.t||0;ps=rin.s||0});
}
async function join(c){
 const r=await get(P('rooms/'+c));if(!r.exists()||r.val().p2)return false;
 const t=await runTransaction(P(`rooms/${c}/p2`),cur=>cur?undefined:{n:nm(),t:myT});
 if(!t.committed)return false;
 role='guest';code=c;names[1]=nm();types[1]=myT;onDisconnect(P(`rooms/${c}/p2`)).remove();enter();
 onValue(P(`rooms/${c}/p1`),s=>{const v=s.val();if(v){names[0]=v.n;types[0]=v.t|0}else if(role){role=null;$('msg').innerHTML='Avversario uscito';setTimeout(()=>location.reload(),2200)}});
 onValue(P(`rooms/${c}/s`),s=>{if(s.val()){snap=s.val();snapT=performance.now()}});
 return true;
}
async function create(){const c=rid();await set(P('rooms/'+c),{p1:{n:nm(),t:myT}});host(c)}
async function quick(){
 st('Cerco un avversario…');const c=rid();await set(P('rooms/'+c),{p1:{n:nm(),t:myT}});
 for(let i=0;i<6;i++){
  let prev=null;
  await runTransaction(P('queue'),q=>{prev=q;return q?null:c});
  if(!prev){onDisconnect(P('queue')).remove();return host(c)}
  if(await join(prev)){remove(P('rooms/'+c));return}
 }
 remove(P('rooms/'+c));st('Nessuno trovato, riprova.');
}
function solo(){role='solo';names=[nm(),'Bot'];types=[myT,Math.random()*4|0];sc=[0,0];enter();startRound()}
let aiT=0,aiX=0,aiY=0;
function ai(dt){ // avversario controllato dal computer
 const b=S[1],o=S[0],lv=+$('lv').value;aiT-=dt;b.ix=aiX;b.iy=aiY;
 if(ph!==2){b.ix=b.iy=aiX=aiY=0;return}
 if(aiT>0)return;aiT=[.3,.17,.09][lv]+Math.random()*.08;
 const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||1,c=Math.hypot(b.x,b.y)||1;
 const L=lv*.12,tx=o.x+o.vx*L-b.x,ty=o.y+o.vy*L-b.y,tl=Math.hypot(tx,ty)||1;let x=tx/tl,y=ty/tl;
 if(c>R*.65){x-=b.x/c*1.6;y-=b.y/c*1.6}
 if(b.sp<25){x=-b.x/c;y=-b.y/c}
 const l=Math.hypot(x,y)||1;aiX=b.ix=x/l*[.6,.85,1][lv];aiY=b.iy=y/l*[.6,.85,1][lv];
 if(b.cdD<=0&&d>110&&d<280&&Math.random()<[.1,.25,.45][lv])dash(b,o);
 if(b.cdT<=0&&d>150&&d<380&&Math.random()<[.05,.12,.25][lv])vort(b,o);
 if(b.cdG<=0&&d<130&&Math.hypot(o.vx,o.vy)>200&&Math.random()<[.25,.5,.8][lv])gd(b);
 if(b.fury>=100&&d<320&&Math.random()<.4)sup(b,o);
}
$('so').onclick=solo;
TY.forEach((T,i)=>{const e=document.createElement('div');e.className='ty'+(i?'':' on');e.style.setProperty('--c',T.c);e.innerHTML=`<b style="color:${T.c}">${T.ic} ${T.n}</b><small>${T.d}<br>Mossa: ${T.s}</small>`;e.onclick=()=>{myT=i;[...$('pk').children].forEach((x,j)=>x.classList.toggle('on',j===i))};$('pk').appendChild(e)});
